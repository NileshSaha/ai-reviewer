version: '3.8'

services:
  ai-reviewer:
    image: ai-reviewer:latest
    build:
      context: .
    container_name: ai-reviewer
    restart: unless-stopped
    ports:
      - "5999:5999"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_reviewer
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  postgres:
    image: postgres:16-alpine
    container_name: ai-reviewer-postgres
    restart: unless-stopped
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_reviewer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ai-reviewer_postgres_data